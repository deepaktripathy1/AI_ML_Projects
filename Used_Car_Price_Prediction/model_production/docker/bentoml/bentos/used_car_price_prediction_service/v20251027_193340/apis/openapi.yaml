openapi: 3.0.2
paths:
  /health:
    post:
      description: Health check endpoint.
      operationId: used_car_price_prediction_service__health
      requestBody:
        content:
          application/json:
            schema:
              properties: {}
              title: Input
              type: object
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
          description: Successful Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
          description: Bad Request
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      tags:
      - Service APIs
      x-bentoml-name: health
  /healthz:
    get:
      description: Health check endpoint. Expecting an empty response with status
        code <code>200</code> when the service is in health state. The <code>/healthz</code>
        endpoint is <b>deprecated</b>. (since Kubernetes v1.16)
      responses:
        '200':
          description: Successful Response
      tags:
      - Infrastructure
  /livez:
    get:
      description: Health check endpoint for Kubernetes. Healthy endpoint responses
        with a <code>200</code> OK status.
      responses:
        '200':
          description: Successful Response
      tags:
      - Infrastructure
  /metrics:
    get:
      description: Prometheus metrics endpoint. The <code>/metrics</code> responses
        with a <code>200</code>. The output can then be used by a Prometheus sidecar
        to scrape the metrics of the service.
      responses:
        '200':
          description: Successful Response
      tags:
      - Infrastructure
  /model_info:
    post:
      description: Get model information and feature details.
      operationId: used_car_price_prediction_service__model_info
      requestBody:
        content:
          application/json:
            schema:
              properties: {}
              title: Input
              type: object
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
          description: Successful Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
          description: Bad Request
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      tags:
      - Service APIs
      x-bentoml-name: model_info
  /predict_batch:
    post:
      description: "Predict car prices for multiple cars with complete processing\
        \ pipeline.\n\n        Args:\n            input_data: Batch of raw car data\n\
        \n        Returns:\n            BatchPredictionOutput: Batch predictions with\
        \ metadata\n        "
      operationId: used_car_price_prediction_service__predict_batch
      requestBody:
        content:
          application/json:
            schema:
              properties:
                input_data:
                  $ref: '#/components/schemas/BatchPredictionInput'
              required:
              - input_data
              title: Input
              type: object
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  batch_metadata:
                    description: Batch processing metadata
                    title: Batch Metadata
                    type: object
                  predictions:
                    description: List of prediction results
                    items:
                      $ref: '#/components/schemas/PredictionOutput'
                    title: Predictions
                    type: array
                required:
                - predictions
                - batch_metadata
                title: BatchPredictionOutputIODescriptor
                type: object
          description: Successful Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
          description: Bad Request
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      tags:
      - Service APIs
      x-bentoml-name: predict_batch
  /predict_single:
    post:
      description: "Predict car price for a single car.\n\n        Args:\n       \
        \     input_data: Raw car data\n\n        Returns:\n            PredictionOutput:\
        \ Prediction with metadata\n        "
      operationId: used_car_price_prediction_service__predict_single
      requestBody:
        content:
          application/json:
            schema:
              properties:
                input_data:
                  $ref: '#/components/schemas/RawCarData'
              required:
              - input_data
              title: Input
              type: object
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  confidence_score:
                    description: 95% confidence interval
                    title: Confidence Score
                    type: number
                  input_validation:
                    description: Input validation results
                    title: Input Validation
                    type: object
                  predicted_price:
                    description: Predicted car price
                    title: Predicted Price
                    type: number
                  prediction_metadata:
                    description: Prediction metadata
                    title: Prediction Metadata
                    type: object
                  preprocessing_info:
                    description: Preprocessing steps applied
                    title: Preprocessing Info
                    type: object
                required:
                - predicted_price
                - confidence_score
                - input_validation
                - preprocessing_info
                - prediction_metadata
                title: PredictionOutputIODescriptor
                type: object
          description: Successful Response
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
          description: Bad Request
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      tags:
      - Service APIs
      x-bentoml-name: predict_single
  /readyz:
    get:
      description: A <code>200</code> OK status from <code>/readyz</code> endpoint
        indicated the service is ready to accept traffic. From that point and onward,
        Kubernetes will use <code>/livez</code> endpoint to perform periodic health
        checks.
      responses:
        '200':
          description: Successful Response
      tags:
      - Infrastructure
servers:
- url: .
tags:
- description: BentoML Service API endpoints for inference.
  name: Service APIs
- description: Common infrastructure endpoints for observability.
  name: Infrastructure
