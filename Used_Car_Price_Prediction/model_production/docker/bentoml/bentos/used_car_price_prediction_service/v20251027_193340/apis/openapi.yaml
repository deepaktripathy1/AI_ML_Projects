components:
  schemas:
    BatchPredictionInput:
      description: Input schema for batch predictions.
      properties:
        cars:
          description: Car data for price prediction
          items:
            $ref: '#/components/schemas/RawCarData'
          maxItems: 1000
          minItems: 1
          title: Cars
          type: array
      required:
      - cars
      title: BatchPredictionInput
      type: object
    BatchPredictionOutputIODescriptor:
      properties:
        batch_metadata:
          description: Batch processing metadata
          title: Batch Metadata
          type: object
        predictions:
          description: List of prediction results
          items:
            $ref: '#/components/schemas/PredictionOutput'
          title: Predictions
          type: array
      required:
      - predictions
      - batch_metadata
      title: BatchPredictionOutputIODescriptor
      type: object
    InternalServerError:
      description: Internal Server Error
      properties:
        detail:
          title: Error Detail
          type: string
        error:
          title: Message
          type: string
      required:
      - error
      title: InternalServerError
      type: object
    InvalidArgument:
      description: Bad Request
      properties:
        detail:
          title: Error Detail
          type: string
        error:
          title: Message
          type: string
      required:
      - error
      title: InvalidArgument
      type: object
    NotFound:
      description: Not Found
      properties:
        detail:
          title: Error Detail
          type: string
        error:
          title: Message
          type: string
      required:
      - error
      title: NotFound
      type: object
    PredictionOutput:
      description: Output schema for used car price prediction.
      properties:
        confidence_score:
          description: 95% confidence interval
          title: Confidence Score
          type: number
        input_validation:
          description: Input validation results
          title: Input Validation
          type: object
        predicted_price:
          description: Predicted car price
          title: Predicted Price
          type: number
        prediction_metadata:
          description: Prediction metadata
          title: Prediction Metadata
          type: object
        preprocessing_info:
          description: Preprocessing steps applied
          title: Preprocessing Info
          type: object
      required:
      - predicted_price
      - confidence_score
      - input_validation
      - preprocessing_info
      - prediction_metadata
      title: PredictionOutput
      type: object
    PredictionOutputIODescriptor:
      properties:
        confidence_score:
          description: 95% confidence interval
          title: Confidence Score
          type: number
        input_validation:
          description: Input validation results
          title: Input Validation
          type: object
        predicted_price:
          description: Predicted car price
          title: Predicted Price
          type: number
        prediction_metadata:
          description: Prediction metadata
          title: Prediction Metadata
          type: object
        preprocessing_info:
          description: Preprocessing steps applied
          title: Preprocessing Info
          type: object
      required:
      - predicted_price
      - confidence_score
      - input_validation
      - preprocessing_info
      - prediction_metadata
      title: PredictionOutputIODescriptor
      type: object
    RawCarData:
      description: Input schema for raw data.
      properties:
        accidents_reported:
          description: Number of accidents reported
          maximum: 10
          minimum: 0
          title: Accidents Reported
          type: integer
        brand:
          description: 'Car brand: Honda, Toyota, Ford, Chevrolet,BMW, Volkswagen,
            Tesla, Hyundai, Kia, Nissan'
          title: Brand
          type: string
        color:
          description: 'Car color: Black, Blue, Gray, Red, Silver, White'
          title: Color
          type: string
        engine_cc:
          description: Engine capacity in cc
          maximum: 100000
          minimum: 0
          title: Engine Cc
          type: integer
        fuel_type:
          description: 'Type of fuel: Diesel, Electric, Petrol'
          title: Fuel Type
          type: string
        insurance_valid:
          description: 'Insurance validity: Yes, No'
          title: Insurance Valid
          type: string
        make_year:
          description: Year the car was manufactured
          maximum: 2024
          minimum: 1900
          title: Make Year
          type: integer
        mileage_kmpl:
          anyOf:
          - maximum: 100000.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Mileage in kilometers per liter
          title: Mileage Kmpl
        owner_count:
          description: Number of owners
          maximum: 100
          minimum: 0
          title: Owner Count
          type: integer
        service_history:
          anyOf:
          - type: string
          - type: 'null'
          default: None
          description: 'Service history: Full Service History, Partial Service History,
            None'
          title: Service History
        transmission:
          description: 'Transmission type: Automatic, Manual'
          title: Transmission
          type: string
      required:
      - make_year
      - accidents_reported
      - fuel_type
      - brand
      - transmission
      - color
      - insurance_valid
      - mileage_kmpl
      - engine_cc
      - owner_count
      title: RawCarData
      type: object
    TaskStatusResponse:
      properties:
        created_at:
          title: Created At
          type: string
        executed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Executed At
        status:
          enum:
          - in_progress
          - success
          - failure
          - cancelled
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
      required:
      - task_id
      - status
      - created_at
      - executed_at
      title: TaskStatusResponse
      type: object
    health__Input:
      properties: {}
      title: health__Input
      type: object
    model_info__Input:
      properties: {}
      title: model_info__Input
      type: object
    predict_batch__Input:
      properties:
        input_data:
          $ref: '#/components/schemas/BatchPredictionInput'
      required:
      - input_data
      title: predict_batch__Input
      type: object
    predict_single__Input:
      properties:
        input_data:
          $ref: '#/components/schemas/RawCarData'
      required:
      - input_data
      title: predict_single__Input
      type: object
