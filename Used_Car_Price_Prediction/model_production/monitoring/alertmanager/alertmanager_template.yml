global:
  slack_api_url: {SLACK_API_URL}
  resolve_timeout: 5m
  #smtp_smarthost: "localhost:587"
  #smtp_from: "alertmanager@yourdomain.com"
  #smtp_auth_username: "email@yourdomain.com"
  #smtp_auth_password: "password"

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: "slack-notifications"

  routes:
    - match:
        severity: critical
      receiver: slack-critical
      continue: false
    
    - match:
        severity: warning
      receiver: slack-warnings
      continue: false

receivers:
  # Default receiver for all alerts
  - name: "slack-notifications"
    slack_configs:
      - api_url: {SLACK_API_URL}
        channel: "#ml-alerts"
        title: "ML Monitoring Alert"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Status:* {{ .Status }}
          {{ end }}
        send_resolved: true

  # Critical alerts
  - name: "slack-critical"
    slack_configs:
      - api_url: {SLACK_API_URL}
        channel: "#ml-alerts"
        title: "CRITICAL: ML Model Alert"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}

          *Recommended Actions:*
          • Check Grafana dashboard: http://localhost:3001
          • Review Prometheus metrics: http://localhost:9090
          • Check application logs
          {{ end }}
        send_resolved: true
        color: danger

  # Warning alerts
  - name: "slack-warnings"
    slack_configs:
      - api_url: {SLACK_API_URL}
        channel: "#ml-alerts"
        title: "ML Model Warning"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          {{ end }}
        send_resolved: true
        color: warning