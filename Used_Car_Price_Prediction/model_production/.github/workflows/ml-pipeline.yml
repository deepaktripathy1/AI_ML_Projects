name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    brances: [ main ]
  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Pipeline to run'
        required: true
        type: choice
        options:
          - all
          - data
          - training
          - deployment
          - monitoring

env:
  PYTHON_VERSION: [ "3.11", "3.12" ]
  UV_VERSION: "0.8"

jobs:
  # Job 1: Code Quality and testing
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify uv installation
        run: uv --version

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run Black formatting check
        run: |
          source .venv/bin/activate
          black --check .

      - name: Run Flake8 linting
        run: |
          source .venv/bin/activate
          flake8 src/ tests/

      - name: Run MyPy type checking
        run: |
          source .venv/bin/activate
          mypy src/
        continue-on-error: true

      - name: Run tests with pytest
        run: |
          source .venv/bin/activate
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 2: Build Docker Images
  build-docker:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        service: [fastapi, streamlit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/used-car-price-prediction-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/used-car-price-prediction-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Setup Infrastructure
  setup-infrastructure:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install mlflow

      - name: Start MLflow server
        run: |
          source .venv/bin/activate
          mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            --host 0.0.0.0 \
            --port 8080 &
          sleep 10

      - name: MLflow health check
        run: |
          echo "Checking MLflow..."
          curl -f http://localhost:8080/health || curl -f http://localhost:8080/api/2.0/mlflow/experiments/list || exit 1
          echo "MLflow is ready!"

  # Job 4: Data Pipeline - Prefect
  data-pipeline:
    runs-on: ubuntu-latest
    needs: setup-infrastructure
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline_type == 'all' || github.event.inputs.pipeline_type == 'data') || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies with UV
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Configure environment
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
          echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> $GITHUB_ENV

      - name: Start Prefect server
        run: |
          source .venv/bin/activate
          prefect server start &
          sleep 10

      - name: Start Prefect local worker
        run: |
          source .venv/bin/activate
          prefect worker start --pool default-agent-pool &
          sleep 10

      - name: Run Data Ingestion Pipeline
        run: |
          source .venv/bin/activate
          python prefect_automation/data_pipeline.py

      - name: Upload data pipeline artifacts
        uses: actions/upload-artifact@v3
        with:
          name: data-pipeline-logs
          path: logs/

  # Job 5: Training Pipeline - Prefect
  training-pipeline:
    runs-on: ubuntu-latest
    needs: data-pipeline
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline_type == 'all' || github.event.inputs.pipeline_type == 'training') || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies with UV
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Configure environment
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> $GITHUB_ENV

      - name: Run Training Pipeline
        run: |
          source .venv/bin/activate
          python prefect_automation/training_pipeline.py

      - name: Upload training artifacts
        uses: actions/upload-artifact@v3
        with:
          name: training-logs
          path: |
            logs/training_report.json
            logs/*.log

  # Job 6: Model Deployment - Prefect
  deployment-pipeline:
    runs-on: ubuntu-latest
    needs: training-pipeline
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline_type == 'all' || github.event.inputs.pipeline_type == 'deployment') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies with UV
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Configure environment
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV

      - name: Run Deployment Pipeline
        run: |
          source .venv/bin/activate
          python prefect_automation/deployment_pipeline.py

      - name: Start FastAPI server (smoke test)
        run: |
          source .venv/bin/activate
          uvicorn src.api.endpoints:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health || exit 1

  # Job 7: Monitoring Pipeline - Prefect
  monitoring-pipeline:
    runs-on: ubuntu-latest
    needs: deployment-pipeline
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline_type == 'all' || github.event.inputs.pipeline_type == 'monitoring')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies with UV
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Run Monitoring Pipeline
        run: |
          source .venv/bin/activate
          python prefect_automation/monitoring_pipeline.py

      - name: Upload monitoring reports
        uses: actions/upload-artifact@v3
        with:
          name: monitoring-reports
          path: |
            logs/drift_reports/
            logs/monitoring_reports/

  # Job 8: Deploy to Production
  #deploy-production:
    #runs-on: ubuntu-latest
    #needs: [deployment-pipeline, monitoring-pipeline]
    #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    #environment:
      #name: production
      #url: https://<production>-url.com
    #steps:
      #- name: Checkout code
        #uses: actions/checkout@v4

      #- name: Deploy to production server
        #run: |
          #echo "Deploying to production..."
          # Add your deployment commands here
          # e.g., kubectl apply, terraform apply, etc.

      #- name: Notify deployment
        #uses: 8398a7/action-slack@v3
        #with:
          #status: ${{ job.status }}
          #text: 'Production deployment completed!'
          #webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        #if: always()

  # Job 8: Performance Testing
  performance-test:
    runs-on: ubuntu-latest
    needs: deployment-pipeline
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv venv
          source .venv/bin/activate
          uv pip install locust

      - name: Run load tests
        run: |
          source .venv/bin/activate
          # Start API server
          uvicorn src.api.endpoints:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-test-results
          path: locust_report.html
        if: always()