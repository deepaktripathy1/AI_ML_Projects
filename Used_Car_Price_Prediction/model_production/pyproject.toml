[project]
name = "model_production"
version = "0.1.0"
description = "Used car price prediction using Linear Regression"
license = "MIT"
authors = [
{name = "Deepak Tripathy", email = "deepaktripathy1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = ["machine-learning", "car-price-prediction", "linear-regression"]


dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pymongo>=4.5.0",
    "hopsworks>=3.4.0",
    "feast>=0.54.0",
    "mlflow>=2.7.0",
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "streamlit>=1.26.0",
    "bentoml>=1.1.0",
    "pyjanitor>=0.26.0",
    "evidently>=0.4.0",
    "prometheus-client>=0.16.0",
    "prefect>=3.0.0",
    "prefect-cloud>=0.1.0",
    "pydantic>=2.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "shap>=0.49.0",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
    "pydantic-settings>=2.10.1",
    "confluent-kafka>=2.11"
]

[project.urls]
Homepage = "https://github.com/deepaktripathy1/AI_ML_Projects"
Repository = "https://github.com/deepaktripathy1/AI_ML_Projects/tree/main/Used_Car_Price_Prediction/model_production"
Issues = "https://github.com/deepaktripathy1/AI_ML_Projects/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
"ruff>=0.1.0",
"pytest>=7.4.0",
"pytest-cov>=4.1.0",
"pytest-mock>=3.11.0",
"jupyter>=1.0.0",
"pre-commit>=3.3.0",
"mypy>=1.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
]

ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D", "ARG", "S101"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["dotenv","prefect", "pymongo"]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
