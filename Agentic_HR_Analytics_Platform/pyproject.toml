[project]
name = "agentic-hr-analytics-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.6.1",
    "fastapi>=0.152.0",
    "langsmith>=0.14.11",
    "litellm>=1.106.0",
    "numpy>=2.5.4",
    "openai>=2.54.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
